# Nginx Configuration for 3-Tier Application Deployment
# Location on Web Tier EC2: /etc/nginx/sites-available/bmi-health-tracker
# Enabled via: sudo ln -s /etc/nginx/sites-available/bmi-health-tracker /etc/nginx/sites-enabled/

# Upstream Backend Pool (Application Tier in Private Subnet)
upstream app_backend {
    server 10.0.0.21:3000;
    # Bonus: Load balancing between two backend app servers
    # server 10.0.0.22:3000 weight=1;
    keepalive 32;
}

server {
    listen 80;
    server_name 51.21.249.194;

    # Frontend Static Files
    root /var/www/bmi-health-tracker;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve React SPA Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy to Private Application Tier
    location /api/ {
        proxy_pass http://app_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend Health Check Proxy
    location /health {
        proxy_pass http://app_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

